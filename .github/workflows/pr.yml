name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # Full history: sitemap <lastmod> comes from each entry's last commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 9.0.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint-ste
      - run: pnpm build

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 9.0.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Smoke: the pages every other page depends on. The full suite stays local.
      - run: pnpm exec playwright test --grep "home shows the catalogue|archive lists every result|explained entry 017"
