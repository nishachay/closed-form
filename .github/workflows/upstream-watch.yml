name: upstream-watch

# Once a day, check whether OpenAI changed openai/math since our catalog was built.
# If it did, open (or update) one issue with what changed, so nothing on the site goes stale quietly.
on:
  schedule:
    - cron: '30 3 * * *' # 09:00 IST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const catalog = JSON.parse(fs.readFileSync('src/data/catalog.json', 'utf8'));
            const ours = catalog.source.commit;
            const { data: head } = await github.rest.repos.getCommit({ owner: 'openai', repo: 'math', ref: 'main' });
            if (head.sha === ours) {
              core.info(`Up to date with openai/math ${ours.slice(0, 7)}.`);
              return;
            }
            let history = '';
            try {
              const { data } = await github.rest.repos.getContent({ owner: 'openai', repo: 'math', path: 'history.md' });
              history = Buffer.from(data.content, 'base64').toString('utf8').slice(0, 6000);
            } catch (e) {
              history = '_No history.md found._';
            }
            const compare = `https://github.com/openai/math/compare/${ours}...${head.sha}`;
            const title = 'openai/math changed upstream: refresh the catalog';
            const body = [
              `OpenAI updated **openai/math**. The site is built from \`${ours.slice(0, 7)}\`; upstream is now \`${head.sha.slice(0, 7)}\` (${head.commit.committer.date}).`,
              '',
              `**What changed:** ${compare}`,
              '',
              '**To refresh (on your computer):**',
              '```bash',
              'cd ~/closed-form',
              'git submodule update --init --remote source/openai-math',
              'pnpm ingest',
              'pnpm test && pnpm build',
              '```',
              'Withdrawn papers are kept automatically with a "Withdrawn" label. Check any explained entry whose paper changed.',
              '',
              '<details><summary>Upstream history.md</summary>',
              '',
              history,
              '',
              '</details>',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'upstream-update',
            });
            if (open.length) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body });
              core.info(`Updated issue #${open[0].number}.`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['upstream-update'],
              });
              core.info(`Opened issue #${issue.number}.`);
            }
