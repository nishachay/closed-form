name: explain

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Comma-separated family ids (e.g. 007,017). Leave empty to use batch.'
        required: false
        default: ''
      batch:
        description: 'How many families needing work to take when ids is empty.'
        required: false
        default: '10'
      concurrency:
        description: 'Parallel families. Keep 1 on free tiers (Gemini / OpenRouter :free rate limits).'
        required: false
        default: '1'

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Explain entries
        id: explain
        # On a daily-quota stop the script exits 0 after writing what finished,
        # so the PR step below still opens a PR with those entries.
        run: |
          if [ -n "${{ inputs.ids }}" ]; then
            pnpm explain --ids "${{ inputs.ids }}" --concurrency "${{ inputs.concurrency || '1' }}" || echo "::warning::Some families failed; opening a PR with the ones that passed."
          else
            pnpm explain --batch "${{ inputs.batch }}" --concurrency "${{ inputs.concurrency || '1' }}" || echo "::warning::Some families failed; opening a PR with the ones that passed."
          fi
        env:
          # Reader, e.g. Gemini free tier: https://generativelanguage.googleapis.com/v1beta/openai/
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          READER_MODEL: ${{ secrets.READER_MODEL }}
          # Checker, e.g. OpenRouter ':free' model: https://openrouter.ai/api/v1
          # Optional: unset/empty falls back to LLM_BASE_URL / LLM_API_KEY.
          CHECK_BASE_URL: ${{ secrets.CHECK_BASE_URL }}
          CHECK_API_KEY: ${{ secrets.CHECK_API_KEY }}
          CHECK_MODEL: ${{ secrets.CHECK_MODEL }}
          # Stream replies so slow reasoning models don't hit fetch's 300 s header
          # timeout, and lift the provider's default output cap (NVIDIA NIM truncated entries).
          LLM_STREAM: '1'
          LLM_MAX_TOKENS: '65536'
      - name: Lint entries
        run: pnpm lint-ste
      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: entries/${{ inputs.ids || format('batch-{0}', github.run_id) }}
          title: "Entries: ${{ inputs.ids || inputs.batch }}${{ steps.explain.outputs.quota_stop == 'true' && ' (partial: quota stop)' || '' }}"
          body-path: pipeline/last-run.md
          commit-message: 'Entries: AI-checked batch'
